<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de usuário</title>
</head>
<body>
	<!-- Cria o formulario
	<form> - tag de formulario
	Atributo "action" apronta para uma página
	Atributo: "method":
		-GET:passa os dados pela URL
		-Post:passa os dados pelo corpo
	-->
	<form action ="#" method="POST">
		<!-- Label - rótulo do Campo -->
		<label>Nome completo:</label>
		<br>
		<!-- Input - Campo de entrda de dados
		TYPE - tipo do Campo
		ID - identificador (para javascript)
		NAME - identificador (para PHP)
	-->
		<input type = "text" id="nome" name="nome">
		<br>
		<!-- INPUT SUBMIT cria um botão-->
		<input type ="submit" value="Cadastrar">
	</form>
</body>
</html>
